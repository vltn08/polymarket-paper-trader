name: trader
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trader
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests anthropic
      - run: python trader.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Sauvegarde etat
        run: |
          git config user.name "trader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json paris.txt
          git diff --cached --quiet || (git commit -m "cycle" && git push)
